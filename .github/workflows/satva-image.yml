# Satva: build the deploy image for Coolify (ghcr.io/satva-git/obot-satva:<branch-slug>)
name: satva-image
on:
  push:
    branches: ["satva/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME#satva/}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/satva-git/obot-satva:${{ steps.tag.outputs.tag }}
          # ponytail: providers pinned to the release we are patching, so only our commits differ from live
          build-args: |
            PROVIDERS_IMAGE=ghcr.io/obot-platform/providers:v0.25.1
            ENTERPRISE_PROVIDERS_IMAGE=ghcr.io/obot-platform/enterprise-providers:v0.25.1
            ENCRYPTION_BINS_IMAGE=ghcr.io/obot-platform/providers/encryption-bins:v0.25.1
