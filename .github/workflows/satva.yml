# Satva pipeline: test -> build image -> (approval) deploy to Coolify, with auto-rollback.
#   push to any satva/** branch : test + build ghcr.io/satva-git/obot-satva:sha-<commit>
#   push to satva/main          : same, then deploy after approval in the "production" environment
#   Run workflow + tag          : redeploy/roll back to an existing image tag, no build
# Runbook: .github/satva/README.md
name: satva
on:
  push:
    branches: ["satva/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy, e.g. sha-1a2b3c4 (rollback). Empty = build this commit."
        required: false
        default: ""
concurrency:
  group: satva-${{ github.ref }}
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/satva-git/obot-satva
jobs:
  test:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./pkg/api/handlers/ -run Skill
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/user/package.json
      # ponytail: this Obot release ships no UI test runner; vitest is added in CI only, to run our skills specs
      - working-directory: ui/user
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D vitest@3
          pnpm exec vitest run src/routes/skills

  build:
    needs: test
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "base=$(git describe --tags --abbrev=0 --match 'v*')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          # Providers pinned to the upstream release we are patching, so only our commits differ.
          build-args: |
            PROVIDERS_IMAGE=ghcr.io/obot-platform/providers:${{ steps.v.outputs.base }}
            ENTERPRISE_PROVIDERS_IMAGE=ghcr.io/obot-platform/enterprise-providers:${{ steps.v.outputs.base }}
            ENCRYPTION_BINS_IMAGE=ghcr.io/obot-platform/providers/encryption-bins:${{ steps.v.outputs.base }}

  deploy:
    needs: build
    if: always() && github.ref == 'refs/heads/satva/main' && (needs.build.result == 'success' || inputs.tag != '')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/satva/deploy.sh
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
