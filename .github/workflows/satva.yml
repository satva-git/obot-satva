# Satva pipeline: tests only. Coolify builds and deploys satva/main itself (Dockerfile build pack).
# Runbook: .github/satva/README.md
name: satva
on:
  push:
    branches: ["satva/**"]
concurrency:
  group: satva-${{ github.ref }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./pkg/api/handlers/ -run Skill
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/user/package.json
      # ponytail: this Obot release ships no UI test runner; vitest is added in CI only, to run our skills specs
      - working-directory: ui/user
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D vitest@3
          pnpm exec vitest run src/routes/skills

